<!DOCTYPE html>
<html lang="es" data-theme="light" data-fontsize="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Un Mundo en Silencio — Inclusión en Red e Integración Social">
  <title>Un Mundo en Silencio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>

  <!-- Tailwind CDN (dev) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <!-- Design System -->
  <link rel="stylesheet" href="css/design-system.css">
  <!-- Legacy CSS (mantiene compatibilidad con módulos existentes) -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ========== PAGE CONTAINER ========== -->
  <!-- Las páginas se cargan aquí dinámicamente por el router -->
  <div id="page-container"></div>

  <!-- ========== MODAL: Lengua de Señas ========== -->
  <div id="modal-sign-language" style="display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.5);" data-close-modal></div>
    <div style="position:relative;background:white;border-radius:1.5rem;padding:2rem;max-width:400px;width:90%;max-height:80dvh;overflow-y:auto;z-index:1;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h2 style="font-family:var(--font-headline);font-weight:900;color:var(--c-primary);">Instrucciones en LSC</h2>
        <button data-close-modal style="background:none;border:none;cursor:pointer;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div style="background:var(--c-surface-high);border-radius:1rem;height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;">
        <div style="text-align:center;color:var(--c-outline);">
          <span class="material-symbols-outlined" style="font-size:48px;opacity:.4;">videocam</span>
          <p style="margin-top:0.5rem;font-size:0.875rem;">Video en Lengua de Señas Colombiana</p>
          <p style="font-size:0.75rem;opacity:.6;">Próximamente</p>
        </div>
      </div>
      <h3 style="font-weight:700;color:var(--c-primary);margin-bottom:0.5rem;">¿Qué es Un Mundo en Silencio?</h3>
      <p style="font-size:0.875rem;color:var(--c-on-surf-var);line-height:1.6;">Aplicación diseñada para facilitar la comunicación en el entorno académico de personas con discapacidad auditiva.</p>
      <button class="ds-btn ds-btn--primary ds-btn--full" style="margin-top:1.5rem;" data-close-modal>
        <span class="material-symbols-outlined">check</span> Entendido
      </button>
    </div>
  </div>

  <!-- ========== NAV GLOBAL (renderizado por rol desde app.js) ========== -->
  <nav id="app-nav" class="ds-bottom-nav" style="display:none;"></nav>

  <!-- ========== TOAST ========== -->
  <div id="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Cordova (requerido para plugins nativos, en navegador Cordova inyecta uno mock) -->
  <script src="cordova.js"></script>

  <!-- App Modules -->
  <script src="js/config.js"></script>
  <script src="js/firestore.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/audio-monitor.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/video-subtitles.js"></script>

  <!-- Carga Condicional de Transcripción y App.js -->
  <script>
    // Esperar 1 segundo para asegurar la detección de Cordova
    setTimeout(() => {
      // Solo usar la versión Cordova nativa si estamos en iOS o Android. 
      // Si estamos en 'browser' (cordova run browser) o en servidor web normal, usar web.
      const isMobileCordova = window.cordova && ['ios', 'android'].includes(window.cordova.platformId);
      
      const scriptTranscription = document.createElement('script');
      scriptTranscription.src = isMobileCordova ? 'js/transcription-cordova.js' : 'js/transcription.js';
      
      scriptTranscription.onload = () => {
        // Una vez cargado el módulo de transcripción, cargamos el app.js principal
        const scriptApp = document.createElement('script');
        scriptApp.src = 'js/app.js';
        scriptApp.onload = () => {
          // Como app.js se cargó de forma asíncrona, el evento DOMContentLoaded 
          // ya pasó, así que debemos inicializar la app manualmente.
          if (typeof IrisApp !== 'undefined') {
            IrisApp.init();
          }
        };
        document.body.appendChild(scriptApp);
      };

      document.body.appendChild(scriptTranscription);
    }, 1000);
  </script>
</body>
</html>
