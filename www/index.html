<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS - Grabador de Audio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 300px;
    }

    h1 { font-size: 24px; margin-bottom: 8px; color: #222; }
    p  { font-size: 14px; color: #888; margin-bottom: 32px; }

    .status {
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      font-weight: bold;
      background: #eee;
      color: #555;
    }
    .status.grabando { background: #ffe0e0; color: #c00; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #btnGrabar  { background: #e53935; color: white; }
    #btnDetener { background: #333;    color: white; }

    .ruta {
      margin-top: 20px;
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎙 IRIS</h1>
    <p>Grabador de audio</p>

    <div class="status" id="status">En espera</div>

    <button class="btn" id="btnGrabar"  onclick="startRecording()">⏺ Grabar</button>
    <button class="btn" id="btnDetener" onclick="stopRecording()" disabled>⏹ Detener</button>

    <div class="ruta" id="ruta"></div>
  </div>

  <script src="cordova.js"></script>
  <script>
    // ─── Estado ───────────────────────────────────────────
    var esCordova     = false;
    var mediaRec      = null;   // Cordova Media object
    var mediaRecorder = null;   // Web MediaRecorder object
    var audioChunks   = [];
    var recordingPath = null;

    // ─── Init ─────────────────────────────────────────────
    // Si Cordova está disponible, espera deviceready
    document.addEventListener('deviceready', function () {
      esCordova = true;
      setStatus('Listo para grabar (dispositivo)', false);
    }, false);

    // Si no hay deviceready en 1 segundo, asume navegador
    setTimeout(function () {
      if (!esCordova) {
        setStatus('Listo para grabar (navegador)', false);
      }
    }, 1000);

    // ─── Grabar ───────────────────────────────────────────
    function startRecording() {
      if (esCordova) {
        startCordova();
      } else {
        startWeb();
      }
      document.getElementById('btnGrabar').disabled  = true;
      document.getElementById('btnDetener').disabled = false;
      document.getElementById('ruta').textContent    = '';
    }

    function stopRecording() {
      if (esCordova) {
        stopCordova();
      } else {
        stopWeb();
      }
      document.getElementById('btnGrabar').disabled  = false;
      document.getElementById('btnDetener').disabled = true;
    }

    // ─── Cordova (dispositivo) ────────────────────────────
    function startCordova() {
      var fileName = 'recording_' + Date.now() + '.wav';
      recordingPath = (typeof device !== 'undefined' && device.platform === 'Android')
        ? cordova.file.externalDataDirectory + fileName
        : cordova.file.documentsDirectory + fileName;

      mediaRec = new Media(
        recordingPath,
        function () { console.log('Media OK'); },
        function (err) { setStatus('Error: ' + err.message, false); }
      );

      mediaRec.startRecord();
      setStatus('🔴 Grabando...', true);
    }

    function stopCordova() {
      if (!mediaRec) return;
      mediaRec.stopRecord();
      mediaRec.release();
      mediaRec = null;
      setStatus('✅ Guardado', false);
      document.getElementById('ruta').textContent = '📁 ' + recordingPath;
    }

    // ─── Web MediaRecorder (navegador) ────────────────────
    function startWeb() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          audioChunks  = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = function () {
            var blob = new Blob(audioChunks, { type: 'audio/wav' });
            var url  = URL.createObjectURL(blob);

            var a = document.createElement('a');
            a.href     = url;
            a.download = 'recording_' + Date.now() + '.wav';
            a.click();

            setStatus('✅ Descargado', false);
            document.getElementById('ruta').textContent = '📁 archivo descargado';
          };

          mediaRecorder.start();
          setStatus('🔴 Grabando...', true);
        })
        .catch(function (err) {
          setStatus('Error micrófono: ' + err.message, false);
          document.getElementById('btnGrabar').disabled  = false;
          document.getElementById('btnDetener').disabled = true;
        });
    }

    function stopWeb() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // ─── Helpers ──────────────────────────────────────────
    function setStatus(msg, grabando) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className   = 'status' + (grabando ? ' grabando' : '');
    }
  </script>
</body>
</html>
