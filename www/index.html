<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS - Transcripción en Tiempo Real</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
      color: #222;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 16px;
    }

    .modo-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      display: inline-block;
      font-weight: bold;
    }

    .modo-badge.websocket {
      background: #d4edda;
      color: #155724;
    }

    .modo-badge.local {
      background: #fff3cd;
      color: #856404;
    }

    .modo-badge.inactivo {
      background: #eee;
      color: #888;
    }

    .ws-status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      display: inline-block;
      font-weight: bold;
    }

    .ws-status.desconectado {
      background: #eee;
      color: #888;
    }

    .ws-status.conectando {
      background: #fff3cd;
      color: #856404;
    }

    .ws-status.conectado {
      background: #d4edda;
      color: #155724;
    }

    .ws-status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .rec-status {
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      font-weight: bold;
      background: #eee;
      color: #555;
    }

    .rec-status.grabando {
      background: #ffe0e0;
      color: #c00;
    }

    /* ── Visualizador de audio ── */
    #audioCanvas {
      width: 100%;
      height: 56px;
      border-radius: 10px;
      background: #1a1a2e;
      margin-bottom: 16px;
      display: block;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btnGrabar {
      background: #e53935;
      color: white;
    }

    #btnDetener {
      background: #333;
      color: white;
    }

    .transcripcion-label {
      font-size: 12px;
      color: #aaa;
      text-align: left;
      margin-bottom: 6px;
    }

    #transcripcion {
      width: 100%;
      min-height: 120px;
      max-height: 240px;
      overflow-y: auto;
      background: #f8f8f8;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: #333;
      text-align: left;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #transcripcion.vacio {
      color: #bbb;
      font-style: italic;
    }

    #textoParcial {
      color: #aaa;
      font-style: italic;
    }

    .btn-limpiar {
      margin-top: 8px;
      background: none;
      border: none;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-limpiar:hover {
      color: #555;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎙 IRIS</h1>
    <p class="subtitle">Transcripción en tiempo real</p>

    <div class="modo-badge inactivo" id="modoBadge">⚪ Sin modo</div><br>
    <div class="ws-status desconectado" id="wsStatus">⚪ WebSocket sin conectar</div>
    <div class="rec-status" id="recStatus">En espera</div>

    <!-- Visualizador de audio -->
    <canvas id="audioCanvas"></canvas>

    <button class="btn" id="btnGrabar" onclick="startRecording()">⏺ Grabar</button>
    <button class="btn" id="btnDetener" onclick="stopRecording()" disabled>⏹ Detener</button>

    <div class="transcripcion-label">Transcripción:</div>
    <div id="transcripcion" class="vacio">El texto aparecerá aquí mientras hablas...<span id="textoParcial"></span>
    </div>
    <button class="btn-limpiar" onclick="limpiarTranscripcion()">Limpiar</button>
  </div>

  <script src="cordova.js"></script>
  <script src="js/speech-local.js"></script>
  <script>

    // ─── Configuración ─────────────────────────────────────
    var WS_URL = 'wss://softwareirisback-production.up.railway.app';
    var FRAGMENT_MS = 3000;
    var WS_TIMEOUT = 4000;

    // ─── Estado ────────────────────────────────────────────
    var esCordova = false;
    var modoActual = null;
    var mediaRecorder = null;
    var socket = null;
    var textoFinal = '';

    // ─── Visualizador ──────────────────────────────────────
    var audioCtx = null;
    var analyser = null;
    var animFrameId = null;
    var visualStream = null;

    var canvas = document.getElementById('audioCanvas');
    var canvasCtx = canvas.getContext('2d');

    function iniciarVisualizador(stream) {
      visualStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      var source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      var bufferLength = analyser.frequencyBinCount;
      var dataArray = new Uint8Array(bufferLength);

      function draw() {
        animFrameId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        var W = canvas.offsetWidth;
        var H = canvas.offsetHeight;
        canvas.width = W;
        canvas.height = H;

        canvasCtx.clearRect(0, 0, W, H);
        canvasCtx.fillStyle = '#1a1a2e';
        canvasCtx.fillRect(0, 0, W, H);

        var barWidth = (W / bufferLength) * 2.5;
        var x = 0;

        for (var i = 0; i < bufferLength; i++) {
          var barHeight = (dataArray[i] / 255) * H;
          var hue = 200 + (dataArray[i] / 255) * 60; // azul → violeta
          canvasCtx.fillStyle = 'hsl(' + hue + ', 80%, 60%)';
          canvasCtx.fillRect(x, H - barHeight, barWidth - 1, barHeight);
          x += barWidth;
        }
      }

      draw();
    }

    function detenerVisualizador() {
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }

      // Canvas en silencio
      var W = canvas.offsetWidth || 400;
      var H = canvas.offsetHeight || 56;
      canvas.width = W;
      canvas.height = H;
      canvasCtx.fillStyle = '#1a1a2e';
      canvasCtx.fillRect(0, 0, W, H);
    }

    // ─── Init ──────────────────────────────────────────────
    document.addEventListener('deviceready', function () {
      esCordova = true;
      setRecStatus('Listo (dispositivo)', false);
    }, false);

    setTimeout(function () {
      if (!esCordova) setRecStatus('Listo (navegador)', false);
    }, 1000);

    detenerVisualizador(); // canvas oscuro inicial

    // ─── Grabar ────────────────────────────────────────────
    function startRecording() {
      document.getElementById('btnGrabar').disabled = true;
      document.getElementById('btnDetener').disabled = false;

      intentarWebSocket(function (conectado) {
        if (conectado) {
          setModo('websocket');
          if (esCordova) startCordova(); else startWeb();
        } else {
          setModo('local');
          startLocal();
        }
      });
    }

    function stopRecording() {
      // Para MediaRecorder
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder = null;
      }
      SpeechLocal.stop();
      detenerVisualizador();
      setRecStatus('⏳ Transcribiendo...', false);
      document.getElementById('btnGrabar').disabled = false;
      document.getElementById('btnDetener').disabled = true;
      setModo(null);

      // Envía señal FIN y espera respuesta antes de cerrar
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.onmessage = function (e) {
          var texto = e.data;
          if (texto && texto !== '...') {
            agregarTextoFinal(texto);
            setRecStatus('✅ Transcripción lista', false);
          }
          socket.close();
          socket = null;
          setWsStatus('desconectado', '⚪ WebSocket sin conectar');
        };
        socket.send("FIN");
      }
    }

    function pararTodo() {
      if (socket) { socket.close(); socket = null; }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop(); mediaRecorder = null;
      }
      if (window._cordovaMedia) {
        stopCordova();
      }
      SpeechLocal.stop();
      detenerVisualizador();
      setRecStatus('Grabación detenida', false);
      setWsStatus('desconectado', '⚪ WebSocket sin conectar');
    }

    // ─── WebSocket ─────────────────────────────────────────
    function intentarWebSocket(callback) {
      setWsStatus('conectando', '🟡 Intentando conectar...');
      var respondio = false;
      var timer;

      try {
        var ws = new WebSocket(WS_URL);
        ws.binaryType = 'arraybuffer';

        timer = setTimeout(function () {
          if (!respondio) {
            respondio = true;
            ws.close();
            setWsStatus('error', '🔴 Back no disponible — modo local');
            callback(false);
          }
        }, WS_TIMEOUT);

        ws.onopen = function () {
          if (respondio) return;
          respondio = true;
          clearTimeout(timer);
          socket = ws;
          setWsStatus('conectado', '🟢 Conectado al back');
          ws.onmessage = function (e) {
            if (!e.data || e.data === '(fin)') return;
            // Reemplaza texto completo porque cada respuesta es el acumulado
            textoFinal = e.data.trim() + ' ';
            var el = document.getElementById('transcripcion');
            el.classList.remove('vacio');
            el.textContent = textoFinal;
            var span = document.createElement('span');
            span.id = 'textoParcial';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
          };
          ws.onerror = function () {
            setWsStatus('error', '🔴 Error de conexión');
            pararTodo();
          };
          ws.onclose = function () {
            setWsStatus('desconectado', '⚪ WebSocket cerrado');
          };
          callback(true);
        };

        ws.onerror = function () {
          if (respondio) return;
          respondio = true;
          clearTimeout(timer);
          setWsStatus('error', '🔴 Back no disponible — modo local');
          callback(false);
        };
      } catch (e) {
        setWsStatus('error', '🔴 Error al crear WebSocket');
        callback(false);
      }
    }

    // ─── Modo WebSocket — navegador ────────────────────────
    function startWeb() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          iniciarVisualizador(stream);
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0 && socket && socket.readyState === WebSocket.OPEN) {
              socket.send(e.data);
            }
          };
          mediaRecorder.start(FRAGMENT_MS);
          setRecStatus('🔴 Grabando (back)...', true);
        })
        .catch(function (err) {
          setRecStatus('Error micrófono: ' + err.message, false);
          pararTodo();
        });
    }

    var _cordovaFilePath = null;
    var _cordovaMedia = null;

    // Cordova — graba archivo completo
    function startCordova() {
      var fileName = 'recording_' + Date.now() + '.wav';
      _cordovaFilePath = cordova.file.documentsDirectory + fileName;

      _cordovaMedia = new Media(
        _cordovaFilePath,
        function () { console.log('[Cordova] Media OK'); },
        function (err) { setRecStatus('Error: ' + err.message, false); }
      );

      _cordovaMedia.startRecord();
      setRecStatus('🔴 Grabando...', true);
    }

    // Cordova- detener grabacion

    function stopCordova() {
      if (!_cordovaMedia) return;

      _cordovaMedia.stopRecord();
      _cordovaMedia.release();
      _cordovaMedia = null;

      setRecStatus('⏳ Transcribiendo...', false);

      // Lee el archivo y lo envía al back via HTTP POST
      window.resolveLocalFileSystemURL(_cordovaFilePath, function (fileEntry) {
        fileEntry.file(function (file) {
          var reader = new FileReader();
          reader.onloadend = function () {
            var arrayBuffer = this.result;

            fetch('https://softwareirisback-production.up.railway.app/transcribir', {
              method: 'POST',
              headers: { 'Content-Type': 'audio/wav' },
              body: arrayBuffer
            })
              .then(function (res) { return res.text(); })
              .then(function (texto) {
                if (texto && texto.trim()) {
                  textoFinal = texto.trim() + ' ';
                  var el = document.getElementById('transcripcion');
                  el.classList.remove('vacio');
                  el.textContent = textoFinal;
                  el.scrollTop = el.scrollHeight;
                  setRecStatus('✅ Transcripción lista', false);
                  //guardar_transcripcion(texto); // guarda en back automáticamente
                }
              })
              .catch(function (err) {
                setRecStatus('Error al enviar audio: ' + err.message, false);
              });
          };
          reader.readAsArrayBuffer(file);
        });
      }, function (err) {
        setRecStatus('Error al leer archivo: ' + err.code, false);
      });
    }

    // ─── Modo Local — Web Speech API ───────────────────────
    function startLocal() {
      if (!SpeechLocal.estaDisponible()) {
        setRecStatus('Speech API no disponible en este navegador', false);
        document.getElementById('btnGrabar').disabled = false;
        document.getElementById('btnDetener').disabled = true;
        setModo(null);
        return;
      }

      // Pide micrófono para el visualizador (independiente de Speech API)
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          iniciarVisualizador(stream);

          SpeechLocal.start(
            function (resultado) {
              document.getElementById('textoParcial').textContent =
                resultado.esFinal ? '' : ' ' + resultado.parcial;
              if (resultado.esFinal && resultado.final.trim()) {
                agregarTextoFinal(resultado.final);
              }
            },
            function (error) {
              setRecStatus('Error: ' + error, false);
            }
          );

          setRecStatus('🔴 Grabando (local)...', true);
        })
        .catch(function (err) {
          // Si falla getUserMedia, intenta Speech API sin visualizador
          console.warn('[IRIS] Visualizador no disponible:', err.message);

          SpeechLocal.start(
            function (resultado) {
              document.getElementById('textoParcial').textContent =
                resultado.esFinal ? '' : ' ' + resultado.parcial;
              if (resultado.esFinal && resultado.final.trim()) {
                agregarTextoFinal(resultado.final);
              }
            },
            function (error) { setRecStatus('Error: ' + error, false); }
          );

          setRecStatus('🔴 Grabando (local, sin visual)...', true);
        });
    }

    // ─── Transcripción ─────────────────────────────────────
    function agregarTextoFinal(texto) {
      var el = document.getElementById('transcripcion');
      el.classList.remove('vacio');
      textoFinal += texto.trim() + ' ';
      el.textContent = textoFinal;
      var span = document.createElement('span');
      span.id = 'textoParcial';
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
    }

    function limpiarTranscripcion() {
      textoFinal = '';
      var el = document.getElementById('transcripcion');
      el.innerHTML = 'El texto aparecerá aquí mientras hablas...<span id="textoParcial"></span>';
      el.classList.add('vacio');
    }

    // ─── Helpers UI ────────────────────────────────────────
    function setModo(modo) {
      var el = document.getElementById('modoBadge');
      if (modo === 'websocket') {
        el.textContent = '🟢 Modo: Backend';
        el.className = 'modo-badge websocket';
      } else if (modo === 'local') {
        el.textContent = '🟡 Modo: Local (sin back)';
        el.className = 'modo-badge local';
      } else {
        el.textContent = '⚪ Sin modo';
        el.className = 'modo-badge inactivo';
      }
    }

    function setRecStatus(msg, grabando) {
      var el = document.getElementById('recStatus');
      el.textContent = msg;
      el.className = 'rec-status' + (grabando ? ' grabando' : '');
    }

    function setWsStatus(tipo, msg) {
      var el = document.getElementById('wsStatus');
      el.textContent = msg;
      el.className = 'ws-status ' + tipo;
    }

  </script>
</body>

</html>
